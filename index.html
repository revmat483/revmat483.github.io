<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Black & Green Messenger</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #0a0f0f;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }
        #app {
            width: 100%;
            height: 100%;
            max-width: 1400px;
            background: #1a1e1e;
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 255, 0, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #2a3a2a;
        }
        /* ----- ЭКРАН ВХОДА / РЕГИСТРАЦИИ ----- */
        .login-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 20px;
            background: #121716;
        }
        .login-card {
            background: #1e2623;
            padding: 48px 40px;
            border-radius: 48px;
            box-shadow: 0 20px 35px -8px rgba(0, 255, 0, 0.2), 0 0 0 1px #2a3a2a inset;
            width: 100%;
            max-width: 440px;
            text-align: center;
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
        .login-card h2 {
            color: #4ade80;
            margin-bottom: 32px;
            font-weight: 600;
            font-size: 32px;
            letter-spacing: -0.5px;
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.3);
        }
        .login-card h2 i {
            color: #4ade80;
            margin-right: 10px;
        }
        .login-card input {
            width: 100%;
            padding: 16px 20px;
            margin: 10px 0;
            border: 2px solid #2a3a2a;
            border-radius: 50px;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
            background: #1e2623;
            color: #e0e0e0;
        }
        .login-card input:focus {
            border-color: #4ade80;
            background: #1e2a26;
            box-shadow: 0 0 0 4px rgba(74, 222, 128, 0.15);
            color: white;
        }
        .login-actions {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }
        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .btn-primary {
            background: #4ade80;
            color: #0a0f0f;
        }
        .btn-primary:hover {
            background: #22c55e;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(74, 222, 128, 0.3);
        }
        .btn-secondary {
            background: #2a3a2a;
            color: #e0e0e0;
        }
        .btn-secondary:hover {
            background: #3a4a3a;
            transform: translateY(-2px);
        }
        .error-message {
            color: #f87171;
            margin-top: 20px;
            font-size: 14px;
            font-weight: 500;
        }
        /* ----- ОСНОВНОЙ ИНТЕРФЕЙС ЧАТА ----- */
        .chat-interface {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: #1a1e1e;
        }
        .chat-header {
            background: #1e2623;
            color: #4ade80;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 12px rgba(0, 255, 0, 0.1);
            border-bottom: 1px solid #2a3a2a;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 18px;
            font-weight: 500;
            color: #e0e0e0;
        }
        .user-info i {
            font-size: 28px;
            color: #4ade80;
        }
        .header-actions {
            display: flex;
            gap: 10px;
        }
        .header-btn, .logout-btn {
            background: #1e2623;
            border: 1px solid #2a3a2a;
            color: #e0e0e0;
            padding: 8px 16px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-btn:hover, .logout-btn:hover {
            background: #2a3a2a;
            border-color: #4ade80;
            color: #4ade80;
        }
        .header-btn.danger:hover {
            background: #4a1e1e;
            border-color: #f87171;
            color: #f87171;
        }
        .chat-main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        /* ----- СПИСОК КОНТАКТОВ ----- */
        .contacts-panel {
            width: 300px;
            background: #1a1e1e;
            border-right: 1px solid #2a3a2a;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .add-contact {
            padding: 20px;
            border-bottom: 1px solid #2a3a2a;
        }
        .add-contact h4 {
            margin-bottom: 12px;
            color: #4ade80;
            font-size: 15px;
            font-weight: 600;
        }
        .add-contact-input {
            display: flex;
            gap: 8px;
        }
        .add-contact-input input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #2a3a2a;
            border-radius: 40px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
            background: #1e2623;
            color: #e0e0e0;
        }
        .add-contact-input input:focus {
            border-color: #4ade80;
            box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.1);
        }
        .add-contact-input button {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: #4ade80;
            color: #0a0f0f;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .add-contact-input button:hover {
            background: #22c55e;
            transform: scale(1.05);
        }
        .notification {
            margin-top: 12px;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            animation: fadeIn 0.2s;
        }
        .notification.success {
            background: #1e3a2a;
            color: #4ade80;
            border: 1px solid #4ade80;
        }
        .notification.error {
            background: #3a1e1e;
            color: #f87171;
            border: 1px solid #f87171;
        }
        .contacts-list {
            flex: 1;
            overflow-y: auto;
        }
        .contacts-list h3 {
            padding: 16px 20px 8px;
            color: #6b8c6b;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        .contact-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            cursor: pointer;
            border-bottom: 1px solid #2a3a2a;
            transition: 0.2s;
        }
        .contact-item:hover {
            background: #1e2623;
        }
        .contact-item.active {
            background: #1e3a2a;
            border-left: 4px solid #4ade80;
        }
        .contact-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .contact-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #2a3a2a;
            color: #4ade80;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .contact-name {
            font-weight: 500;
            font-size: 15px;
            color: #e0e0e0;
        }
        .delete-contact-btn {
            background: transparent;
            border: none;
            color: #6b8c6b;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            transition: 0.2s;
            opacity: 0.5;
        }
        .contact-item:hover .delete-contact-btn {
            opacity: 1;
        }
        .delete-contact-btn:hover {
            color: #f87171;
            background: #3a1e1e;
        }
        /* ----- ОБЛАСТЬ ЧАТА ----- */
        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1a1e1e;
        }
        .chat-placeholder {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4a5a4a;
            font-size: 16px;
            background: #1a1e1e;
        }
        .chat-with-bar {
            background: #1e2623;
            padding: 16px 24px;
            border-bottom: 1px solid #2a3a2a;
            font-weight: 600;
            color: #4ade80;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .chat-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 18px;
        }
        .delete-chat-btn {
            background: transparent;
            border: none;
            color: #6b8c6b;
            font-size: 18px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: 0.2s;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .delete-chat-btn:hover {
            background: #3a1e1e;
            color: #f87171;
        }
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: #1a1e1e;
        }
        .message-wrapper {
            position: relative;
            max-width: 70%;
            align-self: flex-start;
        }
        .message-wrapper.own {
            align-self: flex-end;
        }
        .message {
            padding: 12px 18px;
            border-radius: 24px;
            word-wrap: break-word;
            animation: messageAppear 0.2s ease-out;
            position: relative;
        }
        .message.own {
            background: #1e3a2a;
            color: #e0e0e0;
            border-bottom-right-radius: 4px;
        }
        .message.other {
            background: #1e2623;
            color: #e0e0e0;
            border-bottom-left-radius: 4px;
            border: 1px solid #2a3a2a;
        }
        .message-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #6b8c6b;
            margin-top: 6px;
        }
        .message-sender {
            font-weight: 600;
            margin-right: 8px;
        }
        .message-time {
            font-size: 10px;
        }
        .file-message {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .file-message i {
            font-size: 24px;
            color: #4ade80;
        }
        .file-message .file-info {
            display: flex;
            flex-direction: column;
        }
        .file-message .file-name {
            font-size: 14px;
            font-weight: 500;
            word-break: break-word;
        }
        .file-message .file-size {
            font-size: 11px;
            color: #6b8c6b;
        }
        .file-message audio, .file-message video {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
        }
        .file-download {
            background: #2a3a2a;
            color: #e0e0e0;
            border: none;
            border-radius: 20px;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .file-download:hover {
            background: #3a4a3a;
        }
        .voice-message {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 200px;
        }
        .voice-message audio {
            height: 40px;
            width: 100%;
            filter: invert(1) hue-rotate(90deg);
        }
        .message-actions {
            position: absolute;
            top: -10px;
            right: 0;
            display: flex;
            gap: 4px;
            background: #1e2623;
            border-radius: 20px;
            padding: 4px;
            border: 1px solid #2a3a2a;
            opacity: 0;
            transition: 0.2s;
        }
        .message-wrapper:hover .message-actions {
            opacity: 1;
        }
        .message-actions button {
            background: none;
            border: none;
            color: #6b8c6b;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 16px;
            font-size: 12px;
        }
        .message-actions button:hover {
            background: #2a3a2a;
            color: #4ade80;
        }
        .edited-tag {
            font-size: 10px;
            color: #6b8c6b;
            margin-left: 8px;
            font-style: italic;
        }
        .message-input-area {
            display: flex;
            padding: 16px 24px;
            background: #1e2623;
            gap: 12px;
            border-top: 1px solid #2a3a2a;
            align-items: center;
        }
        .message-input-area input {
            flex: 1;
            padding: 16px 20px;
            border: 2px solid #2a3a2a;
            border-radius: 50px;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
            background: #1a1e1e;
            color: #e0e0e0;
            -webkit-appearance: none;
        }
        .message-input-area input:focus {
            border-color: #4ade80;
            box-shadow: 0 0 0 4px rgba(74, 222, 128, 0.1);
        }
        .input-actions {
            display: flex;
            gap: 8px;
        }
        .input-actions button {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            background: #2a3a2a;
            color: #e0e0e0;
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .input-actions button:hover {
            background: #3a4a3a;
            transform: scale(1.05);
        }
        .input-actions button.recording {
            background: #dc2626;
            color: white;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(220, 38, 38, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }
        .input-actions button.send-btn {
            background: #4ade80;
            color: #0a0f0f;
        }
        .input-actions button.send-btn:hover {
            background: #22c55e;
        }
        .back-btn {
            background: none;
            border: none;
            color: #4ade80;
            font-size: 24px;
            cursor: pointer;
            display: none;
            margin-right: 8px;
        }
        /* ----- АДАПТИВНОСТЬ ----- */
        @media (max-width: 700px) {
            .contacts-panel {
                width: 100% !important;
                border-right: none;
                flex: 1;
            }
            .chat-panel {
                width: 100% !important;
                flex: 1;
            }
            .back-btn {
                display: inline-block !important;
                font-size: 28px;
                padding: 8px 12px;
            }
            .chat-main {
                flex-direction: column;
            }
            .message-input-area {
                padding: 12px;
            }
            .message-input-area input {
                padding: 14px 16px;
                font-size: 16px;
            }
            .input-actions button {
                width: 48px;
                height: 48px;
            }
            .message {
                max-width: 85%;
            }
            .login-card {
                padding: 32px 20px;
            }
            .contact-item {
                padding: 16px 20px;
            }
            .delete-contact-btn {
                opacity: 1;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // ========================== НАСТРОЙКИ FIREBASE ==========================
        const FIREBASE_URL = 'https://gamep-79cef-default-rtdb.firebaseio.com/';

        // ========================== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ (REST) ==========================
        async function fbGet(path) {
            const res = await fetch(FIREBASE_URL + path + '.json');
            return res.json();
        }

        async function fbPut(path, data) {
            const res = await fetch(FIREBASE_URL + path + '.json', {
                method: 'PUT',
                body: JSON.stringify(data)
            });
            return res.json();
        }

        async function fbPost(path, data) {
            const res = await fetch(FIREBASE_URL + path + '.json', {
                method: 'POST',
                body: JSON.stringify(data)
            });
            return res.json();
        }

        async function fbDelete(path) {
            const res = await fetch(FIREBASE_URL + path + '.json', {
                method: 'DELETE'
            });
            return res.json();
        }

        // ========================== ГЛОБАЛЬНОЕ СОСТОЯНИЕ ==========================
        const App = {
            currentUser: null,
            contacts: [],
            selectedChatUser: null,
            messages: [],
            pollingInterval: null,
            mobileChatVisible: false,
            mediaRecorder: null,
            audioChunks: [],
            isRecording: false,
            recordingStartTime: null,
            inputValue: '', // для сохранения значения поля ввода
        };

        // ========================== РЕНДЕРИНГ ==========================
        function render() {
            if (!App.currentUser) {
                renderLoginScreen();
            } else {
                renderChatInterface();
            }
        }

        function renderLoginScreen() {
            const appEl = document.getElementById('app');
            appEl.innerHTML = `
                <div class="login-screen">
                    <div class="login-card">
                        <h2><i class="fas fa-comment"></i> Black & Green</h2>
                        <input type="text" id="loginName" placeholder="Имя пользователя" autocomplete="off">
                        <input type="password" id="loginPassword" placeholder="Пароль">
                        <div class="login-actions">
                            <button class="btn btn-primary" id="loginBtn">Войти</button>
                            <button class="btn btn-secondary" id="registerBtn">Регистрация</button>
                        </div>
                        <div class="error-message" id="loginError"></div>
                    </div>
                </div>
            `;
            document.getElementById('loginBtn').addEventListener('click', handleLogin);
            document.getElementById('registerBtn').addEventListener('click', handleRegister);
        }

        function renderChatInterface() {
            const isMobile = window.innerWidth <= 700;

            const contactsHtml = App.contacts.map(contact => {
                const activeClass = (App.selectedChatUser && App.selectedChatUser.id === contact.id) ? 'active' : '';
                const avatarLetter = contact.name.charAt(0).toUpperCase();
                return `
                    <div class="contact-item ${activeClass}" data-contactid="${contact.id}" data-contactname="${contact.name}">
                        <div class="contact-info">
                            <div class="contact-avatar">${avatarLetter}</div>
                            <span class="contact-name">${contact.name}</span>
                        </div>
                        <button class="delete-contact-btn" onclick="deleteContact('${contact.id}', event)"><i class="fas fa-times"></i></button>
                    </div>
                `;
            }).join('');

            let mainContent = '';
            if (isMobile) {
                if (App.mobileChatVisible && App.selectedChatUser) {
                    mainContent = `<div class="chat-panel">${renderChatPanel()}</div>`;
                } else {
                    mainContent = `
                        <div class="contacts-panel">
                            <div class="add-contact">
                                <h4>Добавить контакт</h4>
                                <div class="add-contact-input">
                                    <input type="text" id="addContactInput" placeholder="Имя пользователя">
                                    <button id="addContactBtn"><i class="fas fa-plus"></i></button>
                                </div>
                                <div id="addContactNotification" class="notification" style="display: none;"></div>
                            </div>
                            <div class="contacts-list">
                                <h3>Контакты (${App.contacts.length})</h3>
                                ${contactsHtml}
                            </div>
                        </div>
                    `;
                }
            } else {
                mainContent = `
                    <div class="contacts-panel">
                        <div class="add-contact">
                            <h4>Добавить контакт</h4>
                            <div class="add-contact-input">
                                <input type="text" id="addContactInput" placeholder="Имя пользователя">
                                <button id="addContactBtn"><i class="fas fa-plus"></i></button>
                            </div>
                            <div id="addContactNotification" class="notification" style="display: none;"></div>
                        </div>
                        <div class="contacts-list">
                            <h3>Контакты (${App.contacts.length})</h3>
                            ${contactsHtml}
                        </div>
                    </div>
                    <div class="chat-panel">
                        ${App.selectedChatUser ? renderChatPanel() : '<div class="chat-placeholder">Выберите контакт</div>'}
                    </div>
                `;
            }

            const appEl = document.getElementById('app');
            appEl.innerHTML = `
                <div class="chat-interface">
                    <div class="chat-header">
                        <div class="user-info">
                            <i class="fas fa-user-circle"></i>
                            <span>${App.currentUser.name}</span>
                        </div>
                        <div class="header-actions">
                            <button class="header-btn danger" id="deleteAccountBtn" title="Удалить аккаунт">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                            <button class="logout-btn" id="logoutBtn">Выйти</button>
                        </div>
                    </div>
                    <div class="chat-main">
                        ${mainContent}
                    </div>
                </div>
            `;

            // Кнопка "назад" для мобильной версии
            if (isMobile && App.mobileChatVisible && App.selectedChatUser) {
                const chatWithBar = document.querySelector('.chat-panel .chat-with-bar');
                if (chatWithBar) {
                    const backBtn = document.createElement('button');
                    backBtn.innerHTML = '<i class="fas fa-arrow-left"></i>';
                    backBtn.className = 'back-btn';
                    backBtn.onclick = () => {
                        App.mobileChatVisible = false;
                        render();
                    };
                    const chatTitle = chatWithBar.querySelector('.chat-title');
                    if (chatTitle) {
                        chatTitle.prepend(backBtn);
                    } else {
                        chatWithBar.prepend(backBtn);
                    }
                }
            }

            // Обработчики на контакты (кроме кнопок удаления)
            document.querySelectorAll('.contact-item').forEach(el => {
                el.addEventListener('click', (e) => {
                    if (e.target.closest('.delete-contact-btn')) return;
                    const contactId = el.dataset.contactid;
                    const contactName = el.dataset.contactname;
                    selectChatUser(contactId, contactName);
                    if (window.innerWidth <= 700) {
                        App.mobileChatVisible = true;
                        render();
                    }
                });
            });

            // Обработчик добавления контакта
            document.getElementById('addContactBtn')?.addEventListener('click', addContact);
            document.getElementById('addContactInput')?.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') addContact();
            });

            // Обработчики для чата
            if (App.selectedChatUser) {
                const messagesContainer = document.getElementById('messagesContainer');
                if (messagesContainer) messagesContainer.scrollTop = messagesContainer.scrollHeight;

                const input = document.getElementById('messageInput');
                if (input) {
                    // Восстанавливаем значение и ставим фокус
                    input.value = App.inputValue;
                    // Устанавливаем фокус с небольшой задержкой, чтобы клавиатура открылась
                    setTimeout(() => {
                        input.focus();
                        // Если поле пустое, клавиатура всё равно откроется
                    }, 300);

                    // Обработка ввода для сохранения значения
                    input.addEventListener('input', (e) => {
                        App.inputValue = e.target.value;
                    });

                    input.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' && !e.shiftKey) {
                            e.preventDefault();
                            sendMessage();
                        }
                    });
                }
                document.getElementById('sendBtn')?.addEventListener('click', sendMessage);
                document.getElementById('voiceBtn')?.addEventListener('click', toggleRecording);
                document.getElementById('fileBtn')?.addEventListener('click', () => {
                    document.getElementById('fileInput').click();
                });
                document.getElementById('fileInput')?.addEventListener('change', handleFileSelect);
                document.getElementById('deleteChatBtn')?.addEventListener('click', deleteCurrentChat);
            }

            document.getElementById('logoutBtn')?.addEventListener('click', logout);
            document.getElementById('deleteAccountBtn')?.addEventListener('click', confirmDeleteAccount);
        }

        function renderChatPanel() {
            const chatUser = App.selectedChatUser;
            if (!chatUser) return '';

            const messagesHtml = App.messages.map(msg => {
                const isOwn = msg.senderId === App.currentUser.id;
                const time = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const editedHtml = msg.edited ? '<span class="edited-tag">(ред.)</span>' : '';
                let contentHtml = '';

                if (msg.type === 'voice') {
                    const duration = msg.duration ? Math.round(msg.duration) : 0;
                    const minutes = Math.floor(duration / 60);
                    const seconds = duration % 60;
                    const durationStr = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                    contentHtml = `
                        <div class="voice-message">
                            <i class="fas fa-microphone-alt" style="color:#4ade80;"></i>
                            <audio controls src="${msg.audioUrl}" style="width:100%;"></audio>
                            <span style="font-size:11px; color:#6b8c6b;">${durationStr}</span>
                        </div>
                    `;
                } else if (msg.type === 'file') {
                    const fileExt = msg.fileName.split('.').pop().toLowerCase();
                    const isImage = ['jpg','jpeg','png','gif','bmp','webp'].includes(fileExt);
                    const isVideo = ['mp4','webm','ogg','mov','avi'].includes(fileExt);
                    const isAudio = ['mp3','wav','ogg','m4a','flac'].includes(fileExt);
                    const fileSize = msg.fileSize ? (msg.fileSize / 1024).toFixed(1) + ' KB' : '';

                    let preview = '';
                    if (isVideo) {
                        preview = `<video controls src="${msg.fileUrl}" style="max-width:100%; max-height:200px; border-radius:8px;"></video>`;
                    } else if (isAudio) {
                        preview = `<audio controls src="${msg.fileUrl}" style="width:100%;"></audio>`;
                    } else if (isImage) {
                        preview = `<img src="${msg.fileUrl}" style="max-width:100%; max-height:200px; border-radius:8px;" alt="image">`;
                    }

                    contentHtml = `
                        <div class="file-message">
                            <i class="fas ${isImage ? 'fa-image' : isVideo ? 'fa-video' : isAudio ? 'fa-music' : 'fa-file'}"></i>
                            <div class="file-info">
                                <span class="file-name">${msg.fileName}</span>
                                ${fileSize ? `<span class="file-size">${fileSize}</span>` : ''}
                            </div>
                            ${preview}
                            <a class="file-download" href="${msg.fileUrl}" download="${msg.fileName}" target="_blank">
                                <i class="fas fa-download"></i> Скачать
                            </a>
                        </div>
                    `;
                } else {
                    contentHtml = `<div>${msg.text} ${editedHtml}</div>`;
                }

                const actionsHtml = isOwn && msg.type === 'text' ? `
                    <div class="message-actions">
                        <button onclick="editMessage('${msg.id}')"><i class="fas fa-pen"></i></button>
                        <button onclick="deleteMessage('${msg.id}')"><i class="fas fa-trash"></i></button>
                    </div>
                ` : (isOwn && (msg.type === 'voice' || msg.type === 'file') ? `
                    <div class="message-actions">
                        <button onclick="deleteMessage('${msg.id}')"><i class="fas fa-trash"></i></button>
                    </div>
                ` : '');

                return `
                    <div class="message-wrapper ${isOwn ? 'own' : 'other'}">
                        <div class="message ${isOwn ? 'own' : 'other'}">
                            ${contentHtml}
                            <div class="message-info">
                                <span class="message-sender">${isOwn ? 'Вы' : msg.senderName}</span>
                                <span class="message-time">${time}</span>
                            </div>
                        </div>
                        ${actionsHtml}
                    </div>
                `;
            }).join('');

            // Скрытый input для выбора файла
            const fileInput = '<input type="file" id="fileInput" style="display:none;">';

            return `
                <div class="chat-with-bar">
                    <div class="chat-title">
                        <span>Чат с ${chatUser.name}</span>
                    </div>
                    <button class="delete-chat-btn" id="deleteChatBtn" title="Удалить чат">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </div>
                <div class="messages-container" id="messagesContainer">
                    ${messagesHtml}
                </div>
                <div class="message-input-area">
                    ${fileInput}
                    <input type="text" id="messageInput" placeholder="Сообщение" autocomplete="off">
                    <div class="input-actions">
                        <button id="fileBtn"><i class="fas fa-paperclip"></i></button>
                        <button class="${App.isRecording ? 'recording' : ''}" id="voiceBtn"><i class="fas fa-microphone"></i></button>
                        <button class="send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            `;
        }

        // ========================== АВТОРИЗАЦИЯ ==========================
        async function handleLogin() {
            const name = document.getElementById('loginName').value.trim();
            const pwd = document.getElementById('loginPassword').value.trim();
            const errorEl = document.getElementById('loginError');

            if (!name || !pwd) {
                errorEl.textContent = 'Заполните все поля';
                return;
            }

            try {
                const users = await fbGet('users') || {};
                const found = Object.entries(users).find(([id, u]) => u.name === name && u.password === pwd);
                if (found) {
                    const [id, userData] = found;
                    App.currentUser = { id, name: userData.name };
                    localStorage.setItem('messenger_user', JSON.stringify(App.currentUser));
                    await loadContacts();
                    startPollingIfNeeded();
                    render();
                } else {
                    errorEl.textContent = 'Неверное имя или пароль';
                }
            } catch (e) {
                errorEl.textContent = 'Ошибка соединения';
            }
        }

        async function handleRegister() {
            const name = document.getElementById('loginName').value.trim();
            const pwd = document.getElementById('loginPassword').value.trim();
            const errorEl = document.getElementById('loginError');

            if (!name || !pwd) {
                errorEl.textContent = 'Заполните все поля';
                return;
            }

            try {
                const users = await fbGet('users') || {};
                const existing = Object.values(users).some(u => u.name === name);
                if (existing) {
                    errorEl.textContent = 'Имя уже занято';
                    return;
                }

                const newId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
                await fbPut(`users/${newId}`, { name, password: pwd });
                await fbPut(`contacts/${newId}`, {});
                App.currentUser = { id: newId, name };
                localStorage.setItem('messenger_user', JSON.stringify(App.currentUser));
                App.contacts = [];
                startPollingIfNeeded();
                render();
            } catch (e) {
                errorEl.textContent = 'Ошибка регистрации';
            }
        }

        function logout() {
            stopPolling();
            localStorage.removeItem('messenger_user');
            App.currentUser = null;
            App.selectedChatUser = null;
            App.contacts = [];
            App.messages = [];
            App.mobileChatVisible = false;
            App.inputValue = '';
            if (App.mediaRecorder && App.isRecording) {
                App.mediaRecorder.stop();
            }
            render();
        }

        // ========================== УДАЛЕНИЕ АККАУНТА ==========================
        async function confirmDeleteAccount() {
            const password = prompt('Для удаления аккаунта введите ваш пароль:');
            if (!password) return;

            try {
                const userData = await fbGet(`users/${App.currentUser.id}`);
                if (!userData || userData.password !== password) {
                    alert('Неверный пароль');
                    return;
                }

                if (!confirm('Вы уверены? Все ваши сообщения и контакты будут безвозвратно удалены.')) return;

                await deleteAccount();
            } catch (e) {
                alert('Ошибка при удалении: ' + e.message);
            }
        }

        async function deleteAccount() {
            const userId = App.currentUser.id;

            const messages = await fbGet('messages') || {};
            const chatKeys = Object.keys(messages).filter(key => key.includes(userId));
            for (const chatKey of chatKeys) {
                await fbDelete(`messages/${chatKey}`);
            }

            await fbDelete(`contacts/${userId}`);
            await fbDelete(`users/${userId}`);
            logout();
            alert('Аккаунт удалён');
        }

        // ========================== ЗАГРУЗКА КОНТАКТОВ ==========================
        async function loadContacts() {
            if (!App.currentUser) return;
            const contactsObj = await fbGet(`contacts/${App.currentUser.id}`) || {};
            const contactIds = Object.keys(contactsObj);
            const users = await fbGet('users') || {};
            App.contacts = contactIds
                .map(id => ({ id, name: users[id]?.name }))
                .filter(c => c.name);
        }

        // ========================== ДОБАВЛЕНИЕ КОНТАКТА ==========================
        async function addContact() {
            const input = document.getElementById('addContactInput');
            const username = input.value.trim();
            const notificationEl = document.getElementById('addContactNotification');
            if (!username) return;

            try {
                const users = await fbGet('users') || {};
                const foundEntry = Object.entries(users).find(([id, u]) => u.name === username);
                
                if (!foundEntry) {
                    notificationEl.style.display = 'block';
                    notificationEl.className = 'notification error';
                    notificationEl.textContent = '❌ Пользователь не найден';
                    setTimeout(() => { notificationEl.style.display = 'none'; }, 3000);
                    return;
                }

                const [contactId, contactData] = foundEntry;

                if (contactId === App.currentUser.id) {
                    notificationEl.style.display = 'block';
                    notificationEl.className = 'notification error';
                    notificationEl.textContent = '❌ Нельзя добавить самого себя';
                    setTimeout(() => { notificationEl.style.display = 'none'; }, 3000);
                    return;
                }

                const currentContacts = await fbGet(`contacts/${App.currentUser.id}`) || {};
                if (currentContacts[contactId]) {
                    notificationEl.style.display = 'block';
                    notificationEl.className = 'notification error';
                    notificationEl.textContent = '❌ Контакт уже добавлен';
                    setTimeout(() => { notificationEl.style.display = 'none'; }, 3000);
                    return;
                }

                currentContacts[contactId] = true;
                await fbPut(`contacts/${App.currentUser.id}`, currentContacts);

                await loadContacts();
                render();

                notificationEl.style.display = 'block';
                notificationEl.className = 'notification success';
                notificationEl.textContent = '✅ Пользователь добавлен в контакты';
                setTimeout(() => { notificationEl.style.display = 'none'; }, 3000);
                input.value = '';

            } catch (e) {
                notificationEl.style.display = 'block';
                notificationEl.className = 'notification error';
                notificationEl.textContent = '❌ Ошибка при добавлении';
                setTimeout(() => { notificationEl.style.display = 'none'; }, 3000);
                console.error(e);
            }
        }

        // ========================== УДАЛЕНИЕ КОНТАКТА ==========================
        window.deleteContact = async function(contactId, event) {
            event.stopPropagation();
            if (!confirm('Удалить этого пользователя из контактов?')) return;

            try {
                const currentContacts = await fbGet(`contacts/${App.currentUser.id}`) || {};
                delete currentContacts[contactId];
                await fbPut(`contacts/${App.currentUser.id}`, currentContacts);

                if (App.selectedChatUser && App.selectedChatUser.id === contactId) {
                    App.selectedChatUser = null;
                    App.messages = [];
                }

                await loadContacts();
                render();
            } catch (e) {
                alert('Ошибка при удалении контакта');
                console.error(e);
            }
        };

        // ========================== РАБОТА С ЧАТОМ ==========================
        function selectChatUser(userId, userName) {
            stopPolling();
            App.selectedChatUser = { id: userId, name: userName };
            App.inputValue = ''; // очищаем сохранённое значение при смене чата
            loadMessages();
            startPollingIfNeeded();
        }

        async function loadMessages() {
            if (!App.currentUser || !App.selectedChatUser) return;
            const chatId = getChatId(App.currentUser.id, App.selectedChatUser.id);
            const msgs = await fbGet(`messages/${chatId}`) || {};
            App.messages = Object.entries(msgs)
                .map(([msgId, msg]) => ({
                    id: msgId,
                    ...msg,
                    senderName: msg.senderId === App.currentUser.id ? App.currentUser.name : App.selectedChatUser.name
                }))
                .sort((a, b) => a.timestamp - b.timestamp);
            render();
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            if (!input) return;
            const text = input.value.trim();
            if (!text || !App.selectedChatUser) return;
            input.value = '';
            App.inputValue = ''; // сохраняем пустоту

            const chatId = getChatId(App.currentUser.id, App.selectedChatUser.id);
            const message = {
                text,
                senderId: App.currentUser.id,
                timestamp: Date.now(),
                edited: false,
                type: 'text'
            };
            try {
                await fbPost(`messages/${chatId}`, message);
            } catch (e) {
                console.error('Send error', e);
            }
            // после отправки фокус останется на поле, т.к. мы не перерендериваем всё принудительно,
            // но следующий polling может обновить интерфейс. Фокус восстановится при рендере.
        }

        // ========================== ОТПРАВКА ФАЙЛА ==========================
        async function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file || !App.selectedChatUser) return;

            if (file.size > 5 * 1024 * 1024) {
                alert('Файл слишком большой (максимум 5 МБ)');
                return;
            }

            const reader = new FileReader();
            reader.onload = async (e) => {
                const fileUrl = e.target.result;
                const chatId = getChatId(App.currentUser.id, App.selectedChatUser.id);
                const message = {
                    senderId: App.currentUser.id,
                    timestamp: Date.now(),
                    type: 'file',
                    fileName: file.name,
                    fileSize: file.size,
                    fileType: file.type,
                    fileUrl: fileUrl
                };
                try {
                    await fbPost(`messages/${chatId}`, message);
                } catch (err) {
                    alert('Ошибка при отправке файла');
                    console.error(err);
                }
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        // ========================== ГОЛОСОВЫЕ СООБЩЕНИЯ ==========================
        async function toggleRecording() {
            if (!App.selectedChatUser) return;

            if (App.isRecording) {
                App.mediaRecorder.stop();
                App.isRecording = false;
                const voiceBtn = document.getElementById('voiceBtn');
                if (voiceBtn) voiceBtn.classList.remove('recording');
            } else {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    App.mediaRecorder = new MediaRecorder(stream);
                    App.audioChunks = [];
                    App.recordingStartTime = Date.now();

                    App.mediaRecorder.ondataavailable = event => {
                        App.audioChunks.push(event.data);
                    };

                    App.mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(App.audioChunks, { type: 'audio/webm' });
                        const duration = (Date.now() - App.recordingStartTime) / 1000;

                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = async () => {
                            const base64Audio = reader.result;

                            const chatId = getChatId(App.currentUser.id, App.selectedChatUser.id);
                            const message = {
                                senderId: App.currentUser.id,
                                timestamp: Date.now(),
                                type: 'voice',
                                audioUrl: base64Audio,
                                duration: duration
                            };
                            try {
                                await fbPost(`messages/${chatId}`, message);
                            } catch (e) {
                                console.error('Voice send error', e);
                            }

                            stream.getTracks().forEach(track => track.stop());
                        };
                    };

                    App.mediaRecorder.start();
                    App.isRecording = true;
                    const voiceBtn = document.getElementById('voiceBtn');
                    if (voiceBtn) voiceBtn.classList.add('recording');
                } catch (err) {
                    alert('Не удалось получить доступ к микрофону');
                    console.error(err);
                }
            }
        }

        // ========================== РЕДАКТИРОВАНИЕ И УДАЛЕНИЕ СООБЩЕНИЙ ==========================
        window.editMessage = async function(messageId) {
            const message = App.messages.find(m => m.id === messageId);
            if (!message || message.senderId !== App.currentUser.id) return;

            const newText = prompt('Редактировать сообщение:', message.text);
            if (newText === null || newText.trim() === '') return;

            const chatId = getChatId(App.currentUser.id, App.selectedChatUser.id);
            const updatedMessage = {
                ...message,
                text: newText.trim(),
                edited: true,
                editedAt: Date.now()
            };
            delete updatedMessage.id;
            try {
                await fbPut(`messages/${chatId}/${messageId}`, updatedMessage);
            } catch (e) {
                alert('Ошибка при редактировании');
                console.error(e);
            }
        };

        window.deleteMessage = async function(messageId) {
            const message = App.messages.find(m => m.id === messageId);
            if (!message || message.senderId !== App.currentUser.id) return;

            if (!confirm('Удалить сообщение?')) return;

            const chatId = getChatId(App.currentUser.id, App.selectedChatUser.id);
            try {
                await fbDelete(`messages/${chatId}/${messageId}`);
            } catch (e) {
                alert('Ошибка при удалении');
                console.error(e);
            }
        };

        function getChatId(uid1, uid2) {
            return uid1 < uid2 ? `chat_${uid1}_${uid2}` : `chat_${uid2}_${uid1}`;
        }

        // ========================== УДАЛЕНИЕ ТЕКУЩЕГО ЧАТА ==========================
        async function deleteCurrentChat() {
            if (!App.currentUser || !App.selectedChatUser) return;

            const confirmDelete = confirm(`Удалить всю переписку с ${App.selectedChatUser.name}? Это действие необратимо.`);
            if (!confirmDelete) return;

            const chatId = getChatId(App.currentUser.id, App.selectedChatUser.id);
            try {
                await fbDelete(`messages/${chatId}`);
                App.messages = [];
                App.selectedChatUser = null;
                if (window.innerWidth <= 700) {
                    App.mobileChatVisible = false;
                }
                render();
            } catch (e) {
                alert('Ошибка при удалении чата');
                console.error(e);
            }
        }

        // ========================== POLLING ==========================
        function startPollingIfNeeded() {
            if (App.pollingInterval) clearInterval(App.pollingInterval);
            if (!App.selectedChatUser) return;

            App.pollingInterval = setInterval(async () => {
                if (!App.currentUser || !App.selectedChatUser) return;
                const chatId = getChatId(App.currentUser.id, App.selectedChatUser.id);
                const msgs = await fbGet(`messages/${chatId}`) || {};
                const messagesArray = Object.entries(msgs)
                    .map(([msgId, msg]) => ({
                        id: msgId,
                        ...msg,
                        senderName: msg.senderId === App.currentUser.id ? App.currentUser.name : App.selectedChatUser.name
                    }))
                    .sort((a, b) => a.timestamp - b.timestamp);

                if (JSON.stringify(App.messages.map(m => m.id)) !== JSON.stringify(messagesArray.map(m => m.id))) {
                    App.messages = messagesArray;
                    render();
                }
            }, 2000);
        }

        function stopPolling() {
            if (App.pollingInterval) {
                clearInterval(App.pollingInterval);
                App.pollingInterval = null;
            }
        }

        // ========================== ИНИЦИАЛИЗАЦИЯ ==========================
        async function init() {
            const saved = localStorage.getItem('messenger_user');
            if (saved) {
                try {
                    App.currentUser = JSON.parse(saved);
                    await loadContacts();
                    startPollingIfNeeded();
                } catch (e) {
                    localStorage.removeItem('messenger_user');
                }
            }
            render();
        }

        window.addEventListener('resize', () => {
            render();
        });

        init();
    </script>
</body>
</html>
