<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlyScripts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0A1F0A 0%, #152515 100%);
            color: #E8F5E9;
            line-height: 1.6;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(37, 211, 102, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(37, 211, 102, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(37, 211, 102, 0.08) 0%, transparent 50%);
            z-index: -1;
        }
        
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        
        .particle {
            position: absolute;
            background: linear-gradient(45deg, #25D366, #2ECC71);
            border-radius: 50%;
            opacity: 0.1;
            animation: float 15s infinite linear;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .main-title {
            text-align: center;
            margin: 40px 0 60px;
            position: relative;
        }
        
        .title-gradient {
            font-size: 4.5rem;
            font-weight: 900;
            background: linear-gradient(45deg, 
                #FF6B6B 0%, 
                #FF8E53 15%, 
                #FFD93D 30%, 
                #6BCF7F 45%, 
                #4D96FF 60%, 
                #9D4BFF 75%, 
                #FF6B6B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
            background-size: 300% 300%;
            animation: gradientShift 8s ease infinite;
            letter-spacing: 2px;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            position: relative;
            display: inline-block;
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .title-gradient::before {
            content: 'FLYSCRIPTS';
            position: absolute;
            top: 2px;
            left: 2px;
            background: linear-gradient(45deg, #000, #333);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            z-index: -1;
            filter: blur(2px);
            opacity: 0.7;
        }
        
        .title-gradient::after {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            background: linear-gradient(45deg, 
                transparent 0%, 
                rgba(255, 107, 107, 0.1) 25%, 
                rgba(255, 142, 83, 0.1) 50%, 
                rgba(255, 217, 61, 0.1) 75%, 
                transparent 100%);
            filter: blur(15px);
            z-index: -1;
            border-radius: 20px;
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: #B0E6B0;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            position: relative;
            display: inline-block;
            padding: 5px 20px;
            background: rgba(37, 211, 102, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(37, 211, 102, 0.2);
            animation: pulseSubtitle 3s infinite;
        }
        
        @keyframes pulseSubtitle {
            0%, 100% { 
                box-shadow: 0 0 20px rgba(37, 211, 102, 0.2);
                transform: scale(1);
            }
            50% { 
                box-shadow: 0 0 30px rgba(37, 211, 102, 0.4);
                transform: scale(1.02);
            }
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            margin-bottom: 30px;
            position: relative;
        }
        
        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                #25D366 20%, 
                #2ECC71 50%, 
                #25D366 80%, 
                transparent 100%);
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
            transition: transform 0.3s ease;
        }
        
        .logo:hover {
            transform: translateY(-3px);
        }
        
        .logo-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(45deg, #25D366, #4CAF50);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: white;
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .logo-icon::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, 
                transparent 30%, 
                rgba(255, 255, 255, 0.1) 50%, 
                transparent 70%);
            animation: shine 3s infinite linear;
        }
        
        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }
        
        .logo-text h1 {
            font-size: 24px;
            background: linear-gradient(45deg, #25D366, #DCF8C6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 2px 10px rgba(37, 211, 102, 0.2);
        }
        
        .logo-text p {
            color: #90EE90;
            font-size: 12px;
            position: relative;
            padding-left: 15px;
        }
        
        .logo-text p::before {
            content: '▶';
            position: absolute;
            left: 0;
            color: #25D366;
        }
        
        .stats {
            display: flex;
            gap: 40px;
            background: linear-gradient(135deg, rgba(37, 211, 102, 0.15), rgba(46, 204, 113, 0.08));
            padding: 20px 30px;
            border-radius: 15px;
            border: 1px solid rgba(37, 211, 102, 0.3);
            backdrop-filter: blur(15px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
        }
        
        .stat-item {
            text-align: center;
            position: relative;
        }
        
        .stat-item::after {
            content: '';
            position: absolute;
            right: -20px;
            top: 50%;
            transform: translateY(-50%);
            width: 1px;
            height: 30px;
            background: linear-gradient(to bottom, transparent, #25D366, transparent);
        }
        
        .stat-item:last-child::after {
            display: none;
        }
        
        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #25D366;
            text-shadow: 0 0 15px rgba(37, 211, 102, 0.4);
            margin-bottom: 5px;
            background: linear-gradient(45deg, #25D366, #2ECC71);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .stat-label {
            font-size: 14px;
            color: #90EE90;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .main-tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 50px;
            flex-wrap: wrap;
            position: relative;
            justify-content: center;
        }
        
        .main-tabs::before {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 1px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(37, 211, 102, 0.4) 50%, 
                transparent 100%);
        }
        
        .main-tab-btn {
            background: linear-gradient(135deg, 
                rgba(30, 58, 30, 0.9), 
                rgba(40, 68, 40, 0.7));
            border: 2px solid rgba(37, 211, 102, 0.3);
            padding: 18px 35px;
            border-radius: 15px;
            color: #B0E6B0;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }
        
        .main-tab-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(255, 255, 255, 0.15), 
                transparent);
            transition: 0.5s;
        }
        
        .main-tab-btn:hover::before {
            left: 100%;
        }
        
        .main-tab-btn:hover {
            background: linear-gradient(135deg, 
                rgba(37, 211, 102, 0.25), 
                rgba(46, 204, 113, 0.15));
            border-color: #25D366;
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 30px rgba(37, 211, 102, 0.4);
        }
        
        .main-tab-btn.active {
            background: linear-gradient(135deg, #25D366, #2ECC71);
            color: white;
            box-shadow: 0 15px 35px rgba(37, 211, 102, 0.5);
            border-color: #25D366;
            animation: pulse 2s infinite;
        }
        
        .script-category-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .category-tab-btn {
            background: linear-gradient(135deg, 
                rgba(50, 70, 50, 0.8), 
                rgba(60, 80, 60, 0.6));
            border: 1px solid rgba(37, 211, 102, 0.2);
            padding: 12px 25px;
            border-radius: 10px;
            color: #B0E6B0;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(5px);
        }
        
        .category-tab-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(255, 255, 255, 0.1), 
                transparent);
            transition: 0.3s;
        }
        
        .category-tab-btn:hover::before {
            left: 100%;
        }
        
        .category-tab-btn:hover {
            background: linear-gradient(135deg, 
                rgba(37, 211, 102, 0.2), 
                rgba(46, 204, 113, 0.1));
            border-color: #25D366;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.3);
        }
        
        .category-tab-btn.active {
            background: linear-gradient(135deg, #FF6B6B, #FF8E53);
            color: white;
            border-color: #FF6B6B;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 15px 35px rgba(37, 211, 102, 0.5); }
            50% { box-shadow: 0 20px 45px rgba(37, 211, 102, 0.7); }
            100% { box-shadow: 0 15px 35px rgba(37, 211, 102, 0.5); }
        }
        
        .main-tab-content {
            display: none;
            animation: fadeIn 0.5s ease;
        }
        
        .main-tab-content.active {
            display: block;
        }
        
        .category-tab-content {
            display: none;
            animation: fadeIn 0.5s ease;
        }
        
        .category-tab-content.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from { 
                opacity: 0; 
                transform: translateY(30px) scale(0.95); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0) scale(1); 
            }
        }
        
        .scripts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            margin-top: 20px;
        }
        
        .script-card {
            background: linear-gradient(135deg, 
                rgba(30, 58, 30, 0.95), 
                rgba(40, 68, 40, 0.85));
            border-radius: 20px;
            padding: 30px;
            border: 2px solid rgba(37, 211, 102, 0.3);
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        
        .script-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #FF6B6B, #FF8E53, #25D366);
        }
        
        .script-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            border-color: #25D366;
        }
        
        .script-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        
        .script-title {
            font-size: 24px;
            color: #DCF8C6;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .script-badge {
            background: linear-gradient(135deg, #FF6B6B, #FF8E53);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .script-description {
            color: #90EE90;
            margin-bottom: 25px;
            line-height: 1.6;
            font-size: 15px;
        }
        
        .script-features {
            margin-bottom: 25px;
        }
        
        .feature {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #B0E6B0;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .feature i {
            color: #25D366;
        }
        
        .script-code {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.4;
            color: #E8F5E9;
            border: 1px solid rgba(37, 211, 102, 0.2);
            white-space: pre;
            tab-size: 4;
        }
        
        .download-btn {
            background: linear-gradient(135deg, #25D366, #2ECC71);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            width: 100%;
            justify-content: center;
            margin-top: 10px;
        }
        
        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(37, 211, 102, 0.4);
        }
        
        .telegram-link {
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #0088cc, #24A1DE);
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            margin-top: 15px;
            transition: all 0.3s ease;
            justify-content: center;
        }
        
        .telegram-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 136, 204, 0.4);
        }
        
        .telegram-link i {
            font-size: 16px;
        }
        
        .section-title {
            font-size: 36px;
            color: #DCF8C6;
            margin-bottom: 40px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            position: relative;
        }
        
        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 3px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                #25D366 50%, 
                transparent 100%);
        }
        
        .footer {
            text-align: center;
            padding: 50px 0;
            margin-top: 80px;
            color: #90EE90;
            font-size: 14px;
            position: relative;
        }
        
        .footer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 1px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(37, 211, 102, 0.4) 50%, 
                transparent 100%);
        }
        
        .footer p {
            margin-bottom: 10px;
            opacity: 0.8;
        }
        
        .notification {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, 
                rgba(30, 58, 30, 0.95), 
                rgba(40, 68, 40, 0.9));
            border: 2px solid #25D366;
            border-radius: 15px;
            padding: 20px;
            color: white;
            z-index: 1000;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            display: none;
            animation: slideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(15px);
            min-width: 300px;
            max-width: 400px;
        }
        
        .notification.show {
            display: block;
        }
        
        /* Стили для админ-панели */
        .admin-panel {
            display: none;
            background: linear-gradient(135deg, 
                rgba(30, 30, 58, 0.95), 
                rgba(40, 40, 68, 0.85));
            border-radius: 20px;
            padding: 30px;
            border: 2px solid rgba(255, 107, 107, 0.3);
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            margin-top: 30px;
        }
        
        .admin-panel.active {
            display: block;
        }
        
        .admin-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .form-group label {
            color: #DCF8C6;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .form-group input,
        .form-group textarea,
        .form-group select {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(37, 211, 102, 0.2);
            border-radius: 8px;
            padding: 12px 15px;
            color: #E8F5E9;
            font-family: 'Arial', sans-serif;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #25D366;
            box-shadow: 0 0 0 2px rgba(37, 211, 102, 0.2);
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
            font-family: 'Courier New', monospace;
        }
        
        .form-actions {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
        }
        
        .admin-btn {
            background: linear-gradient(135deg, #FF6B6B, #FF8E53);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        
        .admin-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 107, 107, 0.4);
        }
        
        .admin-btn.secondary {
            background: linear-gradient(135deg, #4D96FF, #6BCF7F);
        }
        
        .admin-btn.secondary:hover {
            box-shadow: 0 10px 20px rgba(77, 150, 255, 0.4);
        }
        
        .script-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .action-btn {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(37, 211, 102, 0.2);
            color: #B0E6B0;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .action-btn:hover {
            background: rgba(37, 211, 102, 0.2);
            border-color: #25D366;
        }
        
        .action-btn.delete {
            background: rgba(255, 107, 107, 0.2);
            border-color: rgba(255, 107, 107, 0.4);
        }
        
        .action-btn.delete:hover {
            background: rgba(255, 107, 107, 0.4);
            border-color: #FF6B6B;
        }
        
        .admin-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #FF6B6B, #FF8E53);
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 18px;
            cursor: pointer;
            z-index: 1001;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .admin-toggle:hover {
            transform: rotate(90deg) scale(1.1);
            box-shadow: 0 10px 25px rgba(255, 107, 107, 0.6);
        }
        
        .login-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }
        
        .login-modal.active {
            display: flex;
        }
        
        .login-form {
            background: linear-gradient(135deg, 
                rgba(30, 58, 30, 0.95), 
                rgba(40, 68, 40, 0.85));
            border-radius: 20px;
            padding: 40px;
            border: 2px solid rgba(37, 211, 102, 0.3);
            min-width: 400px;
            max-width: 500px;
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        
        .login-form h2 {

                const posY = Math.random() * 100;
                const duration = Math.random() * 10 + 10;
                const delay = Math.random() * 5;

                particle.style.top = `${posY}%`;

                particlesContainer.appendChild(particle);

        }
        
        document.addEventListener('DOMContentLoaded', function() {
            createParticles();
            updateStats();
            setupMainTabs();
            setupCategoryTabs();
            renderScripts();
            updateScriptList();
            
            // Загружаем статистику скачиваний
            const savedDownloads = localStorage.getItem('flyscripts_totalDownloads');
            if (savedDownloads) {
                totalDownloads = parseInt(savedDownloads);
                updateStats();
            }
        });
        
        function setupMainTabs() {
            const mainTabBtns = document.querySelectorAll('.main-tab-btn');
            const mainTabContents = document.querySelectorAll('.main-tab-content');
            
            mainTabBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    mainTabBtns.forEach(b => b.classList.remove('active'));
                    mainTabContents.forEach(c => c.classList.remove('active'));
                    
                    btn.classList.add('active');
                    
                    const tabId = btn.getAttribute('data-tab');
                    document.getElementById(`${tabId}-content`).classList.add('active');
                    
                    showNotification('🚀 Открыты скрипты! Выберите категорию.');
                });
            });
        }
        
        function setupCategoryTabs() {
            const categoryTabBtns = document.querySelectorAll('.category-tab-btn');
            const categoryTabContents = document.querySelectorAll('.category-tab-content');
            
            categoryTabBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    categoryTabBtns.forEach(b => b.classList.remove('active'));
                    categoryTabContents.forEach(c => c.classList.remove('active'));
                    
                    btn.classList.add('active');
                    
                    const category = btn.getAttribute('data-category');
                    document.getElementById(`${category}-content`).classList.add('active');
                    
                    if(category === 'flyscripts') {
                        showNotification('🚀 FlyScripts скрипты');
                    } else if(category === 'scriptich') {
                        showNotification('📱 Scriptich скрипты');
                    } else if(category === 'other') {
                        showNotification('⭐ Другие скрипты');
                    }
                });
            });
        }
        
        function updateStats() {
            const totalFiles = scripts.length;
            document.getElementById('totalFiles').textContent = totalFiles;
            document.getElementById('totalDownloads').textContent = totalDownloads;
        }
        
        function showNotification(message) {
            const notification = document.getElementById('notification');
            const text = document.getElementById('notificationText');
            
            text.textContent = message;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 4000);
        }
        
        function renderScripts() {
            // Очищаем все контейнеры
            document.getElementById('flyscripts-grid').innerHTML = '';
            document.getElementById('scriptich-grid').innerHTML = '';
            document.getElementById('other-grid').innerHTML = '';
            
            // Сортируем скрипты по дате (новые сверху)
            scripts.sort((a, b) => new Date(b.date) - new Date(a.date));
            
            // Рендерим каждый скрипт
            scripts.forEach(script => {
                const scriptCard = createScriptCard(script);
                
                // Добавляем в соответствующий контейнер
                if (script.category === 'flyscripts') {
                    document.getElementById('flyscripts-grid').appendChild(scriptCard);
                } else if (script.category === 'scriptich') {
                    document.getElementById('scriptich-grid').appendChild(scriptCard);
                } else {
                    document.getElementById('other-grid').appendChild(scriptCard);
                }
            });
            
            updateStats();
        }
        
        function createScriptCard(script) {
            const card = document.createElement('div');
            card.className = 'script-card';
            card.id = `script-${script.id}`;
            
            const icon = script.category === 'flyscripts' ? 'fa-rocket' : 
                        script.category === 'scriptich' ? 'fa-layer-group' : 'fa-star';
            
            // Создаем HTML для особенностей
            let featuresHTML = '';
            if (script.features && Array.isArray(script.features)) {
                featuresHTML = script.features.map(feature => `
                    <div class="feature">
                        <i class="fas fa-check-circle"></i>
                        <span>${feature}</span>
                    </div>
                `).join('');
            }
            
            card.innerHTML = `
                <div class="script-header">
                    <h3 class="script-title">
                        <i class="fas ${icon}"></i> ${script.name}
                    </h3>
                    <span class="script-badge">script</span>
                </div>
                
                <p class="script-description">
                    ${script.description}
                </p>
                
                <div class="script-features">
                    ${featuresHTML || `
                    <div class="feature">
                        <i class="fas fa-download"></i>
                        <span>Скачиваний: ${script.downloads || 0}</span>
                    </div>
                    <div class="feature">
                        <i class="fas fa-calendar"></i>
                        <span>Добавлен: ${script.date}</span>
                    </div>
                    `}
                </div>
                
                <div class="script-code">
                    ${script.code}
                </div>
                
                <button class="download-btn" onclick="downloadScript('${script.id}')">
                    <i class="fas fa-download"></i> Скачать скрипт
                </button>
                
                ${script.videoLink ? `
                <a href="${script.videoLink}" target="_blank" class="video-link">
                    <i class="fab fa-youtube"></i> 
                    <span>Видео-инструкция</span>
                </a>` : ''}
                
                ${script.telegramLink ? `
                <a href="${script.telegramLink}" target="_blank" class="telegram-link">
                    <i class="fab fa-telegram"></i> 
                    <span>${script.telegramLink.includes('t.me/Scriptich') ? 'Телеграм: @Scriptich' : 'Telegram'}</span>
                </a>` : ''}
                
                ${isAdmin ? `
                <div class="script-actions">
                    <button class="action-btn" onclick="editScript('${script.id}')">
                        <i class="fas fa-edit"></i> Редактировать
                    </button>
                    <button class="action-btn delete" onclick="deleteScript('${script.id}')">
                        <i class="fas fa-trash"></i> Удалить
                    </button>
                </div>` : ''}
            `;
            
            return card;
        }
        
        function downloadScript(scriptId) {
            const script = scripts.find(s => s.id === scriptId);
            if (!script) {
                showNotification('❌ Ошибка: скрипт не найден');
                return;
            }
            
            const blob = new Blob([script.code], { 
                type: 'text/plain;charset=utf-8',
                endings: 'native' 
            });
            
            const downloadLink = document.createElement('a');
            downloadLink.href = URL.createObjectURL(blob);
            downloadLink.download = script.filename;
            downloadLink.style.display = 'none';
            
            document.body.appendChild(downloadLink);
            downloadLink.click();
            
            document.body.removeChild(downloadLink);
            
            // Обновляем статистику
            script.downloads = (script.downloads || 0) + 1;
            totalDownloads++;
            
            // Сохраняем в localStorage
            saveToLocalStorage();
            updateStats();
            
            showNotification(`✅ Скрипт "${script.name}" скачан!`);
            
            // Обновляем отображение
            const card = document.getElementById(`script-${scriptId}`);
            if (card) {
                const feature = card.querySelector('.script-features .feature:first-child');
                if (feature) {
                    feature.querySelector('span').textContent = `Скачиваний: ${script.downloads}`;
                }
            }
        }
        
        // Админ-функции
        function toggleLoginModal() {
            document.getElementById('loginModal').classList.toggle('active');
        }
        
        function login() {
            const password = document.getElementById('adminPassword').value;
            
            if (password === ADMIN_PASSWORD) {
                isAdmin = true;
                document.getElementById('adminPanel').classList.add('active');
                document.getElementById('loginModal').classList.remove('active');
                document.getElementById('adminPassword').value = '';
                
                // Перерисовываем скрипты с кнопками админа
                renderScripts();
                updateScriptList();
                
                showNotification('🔓 Вы вошли в админ-панель');
            } else {
                showNotification('❌ Неверный пароль!');
            }
        }
        
        function toggleAdvancedMode() {
            advancedMode = !advancedMode;
            const advancedSettings = document.getElementById('advancedSettings');
            const toggleBtn = document.querySelector('[onclick="toggleAdvancedMode()"]');
            
            if (advancedMode) {
                advancedSettings.style.display = 'block';
                toggleBtn.innerHTML = '<i class="fas fa-eye-slash"></i> Обычный режим';
                toggleBtn.classList.add('secondary');
            } else {
                advancedSettings.style.display = 'none';
                toggleBtn.innerHTML = '<i class="fas fa-cogs"></i> Расширенный режим';
                toggleBtn.classList.remove('secondary');
            }
        }
        
        function saveScript() {
            const name = document.getElementById('scriptName').value.trim();
            const category = document.getElementById('scriptCategory').value;
            const description = document.getElementById('scriptDescription').value.trim();
            const code = document.getElementById('scriptCode').value.trim();
            const filename = document.getElementById('scriptFilename').value.trim();
            const videoLink = document.getElementById('videoLink').value.trim();
            const telegramLink = document.getElementById('telegramLink').value.trim();
            const featuresInput = document.getElementById('features').value.trim();
            
            if (!name || !description || !code || !filename) {
                showNotification('❌ Заполните обязательные поля!');
                return;
            }
            
            if (!filename.endsWith('.txt')) {
                showNotification('⚠️ Рекомендуется использовать расширение .txt для файлов');
            }
            
            // Парсим особенности
            const features = featuresInput ? featuresInput.split(',').map(f => f.trim()).filter(f => f) : [];
            
            if (currentEditingId) {
                // Редактирование существующего скрипта
                const index = scripts.findIndex(s => s.id === currentEditingId);
                if (index !== -1) {
                    scripts[index] = {
                        ...scripts[index],
                        name,
                        category,
                        description,
                        code,
                        filename,
                        videoLink,
                        telegramLink,
                        features
                    };
                    showNotification('✏️ Скрипт обновлен!');
                }
            } else {
                // Добавление нового скрипта
                const newScript = {
                    id: generateId(),
                    name,
                    category,
                    description,
                    code,
                    filename,
                    downloads: 0,
                    date: new Date().toISOString().split('T')[0],
                    videoLink,
                    telegramLink,
                    features
                };
                scripts.unshift(newScript);
                showNotification('✅ Новый скрипт добавлен!');
            }
            
            saveToLocalStorage();
            renderScripts();
            updateScriptList();
            clearForm();
            currentEditingId = null;
        }
        
        function editScript(scriptId) {
            const script = scripts.find(s => s.id === scriptId);
            if (!script) return;
            
            currentEditingId = scriptId;
            
            document.getElementById('scriptName').value = script.name;
            document.getElementById('scriptCategory').value = script.category;
            document.getElementById('scriptDescription').value = script.description;
            document.getElementById('scriptCode').value = script.code;
            document.getElementById('scriptFilename').value = script.filename;
            document.getElementById('videoLink').value = script.videoLink || '';
            document.getElementById('telegramLink').value = script.telegramLink || '';
            document.getElementById('features').value = script.features ? script.features.join(', ') : '';
            
            // Показываем кнопку отмены
            document.getElementById('cancelBtn').style.display = 'block';
            
            // Прокручиваем к форме
            document.getElementById('adminForm').scrollIntoView({ behavior: 'smooth' });
            
            showNotification('✏️ Редактирование скрипта');
        }
        
        function cancelEdit() {
            currentEditingId = null;
            clearForm();
            document.getElementById('cancelBtn').style.display = 'none';
            showNotification('❌ Редактирование отменено');
        }
        
        function deleteScript(scriptId) {
            if (!confirm('Вы уверены, что хотите удалить этот скрипт?')) return;
            
            const index = scripts.findIndex(s => s.id === scriptId);
            if (index !== -1) {
                scripts.splice(index, 1);
                saveToLocalStorage();
                renderScripts();
                updateScriptList();
                showNotification('🗑️ Скрипт удален!');
            }
        }
        
        function clearForm() {
            document.getElementById('scriptName').value = '';
            document.getElementById('scriptCategory').value = 'flyscripts';
            document.getElementById('scriptDescription').value = '';
            document.getElementById('scriptCode').value = '';
            document.getElementById('scriptFilename').value = '';
            document.getElementById('videoLink').value = '';
            document.getElementById('telegramLink').value = '';
            document.getElementById('features').value = '';
            document.getElementById('cancelBtn').style.display = 'none';
        }
        
        function updateScriptList() {
            const scriptList = document.getElementById('scriptList');
            scriptList.innerHTML = '';
            
            if (scripts.length === 0) {
                scriptList.innerHTML = '<div class="empty-state" style="padding: 20px;"><p>Нет скриптов</p></div>';
                return;
            }
            
            scripts.forEach(script => {
                const item = document.createElement('div');
                item.className = 'script-card';
                item.style.marginBottom = '10px';
                item.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div style="flex: 1;">
                            <strong>${script.name}</strong>
                            <div style="font-size: 12px; color: #90EE90;">
                                ${script.category} • ${script.downloads || 0} скачиваний • ${script.date}
                            </div>
                            ${script.videoLink ? '<div style="font-size: 11px; color: #FF6B6B;"><i class="fas fa-video"></i> Есть видео</div>' : ''}
                        </div>
                        <div style="display: flex; gap: 5px;">
                            <button class="action-btn" onclick="editScript('${script.id}')" title="Редактировать">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="action-btn delete" onclick="deleteScript('${script.id}')" title="Удалить">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
                scriptList.appendChild(item);
            });
        }
        
        function generateId() {
            return 'script_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }
        
        function saveToLocalStorage() {
            localStorage.setItem('flyscripts_scripts', JSON.stringify(scripts));
            localStorage.setItem('flyscripts_totalDownloads', totalDownloads.toString());
        }
        
        function logout() {
            isAdmin = false;
            document.getElementById('adminPanel').classList.remove('active');
            renderScripts(); // Перерисовываем без кнопок админа
            showNotification('🔒 Вы вышли из админ-панели');
        }
    </script>
</body>
</html>
