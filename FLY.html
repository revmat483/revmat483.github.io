<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlyScripts - Скрипты для автоматизации</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0A1F0A 0%, #152515 100%);
            color: #E8F5E9;
            line-height: 1.6;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(37, 211, 102, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(37, 211, 102, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(37, 211, 102, 0.08) 0%, transparent 50%);
            z-index: -1;
        }
        
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
        
        .particle {
            position: absolute;
            background: linear-gradient(45deg, #25D366, #2ECC71);
            border-radius: 50%;
            opacity: 0.1;
            animation: float 15s infinite linear;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .main-title {
            text-align: center;
            margin: 40px 0 60px;
            position: relative;
        }
        
        .title-gradient {
            font-size: 4.5rem;
            font-weight: 900;
            background: linear-gradient(45deg, 
                #FF6B6B 0%, 
                #FF8E53 15%, 
                #FFD93D 30%, 
                #6BCF7F 45%, 
                #4D96FF 60%, 
                #9D4BFF 75%, 
                #FF6B6B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
            background-size: 300% 300%;
            animation: gradientShift 8s ease infinite;
            letter-spacing: 2px;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            position: relative;
            display: inline-block;
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .title-gradient::before {
            content: 'FLYSCRIPTS';
            position: absolute;
            top: 2px;
            left: 2px;
            background: linear-gradient(45deg, #000, #333);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            z-index: -1;
            filter: blur(2px);
            opacity: 0.7;
        }
        
        .title-gradient::after {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            background: linear-gradient(45deg, 
                transparent 0%, 
                rgba(255, 107, 107, 0.1) 25%, 
                rgba(255, 142, 83, 0.1) 50%, 
                rgba(255, 217, 61, 0.1) 75%, 
                transparent 100%);
            filter: blur(15px);
            z-index: -1;
            border-radius: 20px;
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: #B0E6B0;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            position: relative;
            display: inline-block;
            padding: 5px 20px;
            background: rgba(37, 211, 102, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(37, 211, 102, 0.2);
            animation: pulseSubtitle 3s infinite;
        }
        
        @keyframes pulseSubtitle {
            0%, 100% { 
                box-shadow: 0 0 20px rgba(37, 211, 102, 0.2);
                transform: scale(1);
            }
            50% { 
                box-shadow: 0 0 30px rgba(37, 211, 102, 0.4);
                transform: scale(1.02);
            }
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            margin-bottom: 30px;
            position: relative;
        }
        
        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                #25D366 20%, 
                #2ECC71 50%, 
                #25D366 80%, 
                transparent 100%);
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
            transition: transform 0.3s ease;
        }
        
        .logo:hover {
            transform: translateY(-3px);
        }
        
        .logo-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(45deg, #25D366, #4CAF50);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: white;
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .logo-icon::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, 
                transparent 30%, 
                rgba(255, 255, 255, 0.1) 50%, 
                transparent 70%);
            animation: shine 3s infinite linear;
        }
        
        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }
        
        .logo-text h1 {
            font-size: 24px;
            background: linear-gradient(45deg, #25D366, #DCF8C6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 2px 10px rgba(37, 211, 102, 0.2);
        }
        
        .logo-text p {
            color: #90EE90;
            font-size: 12px;
            position: relative;
            padding-left: 15px;
        }
        
        .logo-text p::before {
            content: '▶';
            position: absolute;
            left: 0;
            color: #25D366;
        }
        
        .stats {
            display: flex;
            gap: 40px;
            background: linear-gradient(135deg, rgba(37, 211, 102, 0.15), rgba(46, 204, 113, 0.08));
            padding: 20px 30px;
            border-radius: 15px;
            border: 1px solid rgba(37, 211, 102, 0.3);
            backdrop-filter: blur(15px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
        }
        
        .stat-item {
            text-align: center;
            position: relative;
        }
        
        .stat-item::after {
            content: '';
            position: absolute;
            right: -20px;
            top: 50%;
            transform: translateY(-50%);
            width: 1px;
            height: 30px;
            background: linear-gradient(to bottom, transparent, #25D366, transparent);
        }
        
        .stat-item:last-child::after {
            display: none;
        }
        
        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #25D366;
            text-shadow: 0 0 15px rgba(37, 211, 102, 0.4);
            margin-bottom: 5px;
            background: linear-gradient(45deg, #25D366, #2ECC71);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .stat-label {
            font-size: 14px;
            color: #90EE90;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .script-category-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .category-tab-btn {
            background: linear-gradient(135deg, 
                rgba(50, 70, 50, 0.8), 
                rgba(60, 80, 60, 0.6));
            border: 1px solid rgba(37, 211, 102, 0.2);
            padding: 12px 25px;
            border-radius: 10px;
            color: #B0E6B0;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(5px);
        }
        
        .category-tab-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(255, 255, 255, 0.1), 
                transparent);
            transition: 0.3s;
        }
        
        .category-tab-btn:hover::before {
            left: 100%;
        }
        
        .category-tab-btn:hover {
            background: linear-gradient(135deg, 
                rgba(37, 211, 102, 0.2), 
                rgba(46, 204, 113, 0.1));
            border-color: #25D366;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.3);
        }
        
        .category-tab-btn.active {
            background: linear-gradient(135deg, #FF6B6B, #FF8E53);
            color: white;
            border-color: #FF6B6B;
        }
        
        .scripts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            margin-top: 20px;
        }
        
        .script-card {
            background: linear-gradient(135deg, 
                rgba(30, 58, 30, 0.95), 
                rgba(40, 68, 40, 0.85));
            border-radius: 20px;
            padding: 30px;
            border: 2px solid rgba(37, 211, 102, 0.3);
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        
        .script-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #FF6B6B, #FF8E53, #25D366);
        }
        
        .script-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            border-color: #25D366;
        }
        
        .script-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        
        .script-title {
            font-size: 24px;
            color: #DCF8C6;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .script-badge {
            background: linear-gradient(135deg, #FF6B6B, #FF8E53);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .script-description {
            color: #90EE90;
            margin-bottom: 25px;
            line-height: 1.6;
            font-size: 15px;
        }
        
        .script-features {
            margin-bottom: 25px;
        }
        
        .feature {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #B0E6B0;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .feature i {
            color: #25D366;
        }
        
        .script-code {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.4;
            color: #E8F5E9;
            border: 1px solid rgba(37, 211, 102, 0.2);
            white-space: pre;
            tab-size: 4;
        }
        
        .download-btn {
            background: linear-gradient(135deg, #25D366, #2ECC71);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            width: 100%;
            justify-content: center;
            margin-top: 10px;
        }
        
        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(37, 211, 102, 0.4);
        }
        
        .telegram-link {
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #0088cc, #24A1DE);
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            margin-top: 15px;
            transition: all 0.3s ease;
            justify-content: center;
        }
        
        .telegram-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 136, 204, 0.4);
        }
        
        .telegram-link i {
            font-size: 16px;
        }
        
        .footer {
            text-align: center;
            padding: 50px 0;
            margin-top: 80px;
            color: #90EE90;
            font-size: 14px;
            position: relative;
        }
        
        .footer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 1px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(37, 211, 102, 0.4) 50%, 
                transparent 100%);
        }
        
        .footer p {
            margin-bottom: 10px;
            opacity: 0.8;
        }
        
        .notification {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, 
                rgba(30, 58, 30, 0.95), 
                rgba(40, 68, 40, 0.9));
            border: 2px solid #25D366;
            border-radius: 15px;
            padding: 20px;
            color: white;
            z-index: 1000;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            display: none;
            animation: slideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(15px);
            min-width: 300px;
            max-width: 400px;
        }
        
        .notification.show {
            display: block;
        }
        
        .loading {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 3000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }
        
        .loading.active {
            display: flex;
        }
        
        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(37, 211, 102, 0.3);
            border-radius: 50%;
            border-top-color: #25D366;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%) translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateX(0) translateY(0);
                opacity: 1;
            }
        }
        
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 25px;
                text-align: center;
            }
            
            .stats {
                width: 100%;
                max-width: 500px;
                gap: 20px;
                padding: 15px 20px;
            }
            
            .title-gradient {
                font-size: 2.8rem;
            }
            
            .scripts-grid {
                grid-template-columns: 1fr;
            }
            
            .script-card {
                padding: 20px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <!-- Загрузка -->
    <div class="loading" id="loading">
        <div class="loader"></div>
    </div>
    
    <div class="container">
        <div class="main-title">
            <div class="title-gradient">FLYSCRIPTS</div>
            <div class="subtitle">Автоматизация для игр</div>
        </div>
        
        <header class="header">
            <div class="logo">
                <div class="logo-icon">F</div>
                <div class="logo-text">
                    <h1>FlyScripts</h1>
                    <p>Автоматизация для игр</p>
                </div>
            </div>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-number" id="totalFiles">0</div>
                    <div class="stat-label">Файлов</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="totalDownloads">0</div>
                    <div class="stat-label">Скачиваний</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">v2.4</div>
                    <div class="stat-label">Версия</div>
                </div>
            </div>
        </header>
        
        <div class="script-category-tabs">
            <button class="category-tab-btn active" data-category="flyscripts">
                <i class="fas fa-rocket"></i> FlyScripts
            </button>
            <button class="category-tab-btn" data-category="scriptich">
                <i class="fab fa-telegram"></i> Scriptich
            </button>
            <button class="category-tab-btn" data-category="other">
                <i class="fas fa-star"></i> Другое
            </button>
        </div>
        
        <!-- Контент FlyScripts -->
        <div class="category-tab-content active" id="flyscripts-content">
            <div class="scripts-grid" id="flyscripts-grid"></div>
        </div>
        
        <!-- Контент Scriptich -->
        <div class="category-tab-content" id="scriptich-content">
            <div class="scripts-grid" id="scriptich-grid"></div>
        </div>
        
        <!-- Контент Другое -->
        <div class="category-tab-content" id="other-content">
            <div class="scripts-grid" id="other-grid"></div>
        </div>
        
        <footer class="footer">
            <p>© 2024 FlyScripts. Все права защищены.</p>
            <p>Сайт для образовательных целей</p>
            <p style="font-size: 12px; color: #6BCF7F; margin-top: 10px;">
                <i class="fas fa-database"></i> Данные синхронизируются в реальном времени
            </p>
        </footer>
    </div>
    
    <div class="notification" id="notification">
        <div id="notificationText"></div>
    </div>

    <script>
        // ================== FIREBASE КОНФИГУРАЦИЯ ==================
        const firebaseConfig = {
            apiKey: "AIzaSyAhPXJ96GF2Pfmh2oK-22VGrT2SdbP0zLQ",
            authDomain: "fmes-aeb0d.firebaseapp.com",
            databaseURL: "https://fmes-aeb0d-default-rtdb.firebaseio.com",
            projectId: "fmes-aeb0d",
            storageBucket: "fmes-aeb0d.appspot.com",
            messagingSenderId: "130550620640",
            appId: "1:130550620640:web:7b1460d45b19a3e41b4afc",
            measurementId: "G-43FWG8L46F"
        };

        // Инициализация Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        
        // ================== ПЕРЕМЕННЫЕ ==================
        let scripts = [];
        let totalDownloads = 0;
        
        // ================== ИНИЦИАЛИЗАЦИЯ ==================
        document.addEventListener('DOMContentLoaded', function() {
            createParticles();
            setupCategoryTabs();
            loadScriptsFromFirebase();
            setupRealtimeUpdates();
        });
        
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 30;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                const size = Math.random() * 10 + 5;
                const posX = Math.random() * 100;
                const posY = Math.random() * 100;
                const duration = Math.random() * 10 + 10;
                const delay = Math.random() * 5;
                
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${posX}%`;
                particle.style.top = `${posY}%`;
                particle.style.opacity = Math.random() * 0.1 + 0.05;
                particle.style.animationDuration = `${duration}s`;
                particle.style.animationDelay = `${delay}s`;
                
                particlesContainer.appendChild(particle);
            }
        }
        
        function setupCategoryTabs() {
            const categoryTabBtns = document.querySelectorAll('.category-tab-btn');
            const categoryTabContents = document.querySelectorAll('.category-tab-content');
            
            categoryTabBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    categoryTabBtns.forEach(b => b.classList.remove('active'));
                    categoryTabContents.forEach(c => c.classList.remove('active'));
                    
                    btn.classList.add('active');
                    
                    const category = btn.getAttribute('data-category');
                    document.getElementById(`${category}-content`).classList.add('active');
                    
                    showNotification(category === 'flyscripts' ? '🚀 FlyScripts скрипты' :
                                  category === 'scriptich' ? '📱 Scriptich скрипты' : '⭐ Другие скрипты');
                });
            });
        }
        
        // ================== FIREBASE ФУНКЦИИ ==================
        
        async function loadScriptsFromFirebase() {
            showLoading();
            try {
                const snapshot = await database.ref('scripts').once('value');
                const data = snapshot.val();
                
                if (data) {
                    scripts = Object.entries(data).map(([id, script]) => ({
                        id,
                        ...script
                    }));
                    
                    const downloadsSnapshot = await database.ref('totalDownloads').once('value');
                    totalDownloads = downloadsSnapshot.val() || 0;
                    
                    updateStats();
                    renderScripts();
                    showNotification(`✅ Загружено ${scripts.length} скриптов`);
                } else {
                    scripts = [];
                    showEmptyState();
                }
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                showNotification('❌ Ошибка загрузки скриптов');
                showEmptyState();
            } finally {
                hideLoading();
            }
        }
        
        function setupRealtimeUpdates() {
            // Слушаем обновления скриптов в реальном времени
            database.ref('scripts').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    scripts = Object.entries(data).map(([id, script]) => ({
                        id,
                        ...script
                    }));
                    renderScripts();
                    updateStats();
                }
            });
            
            // Слушаем обновления статистики
            database.ref('totalDownloads').on('value', (snapshot) => {
                totalDownloads = snapshot.val() || 0;
                updateStats();
            });
        }
        
        async function updateDownloadStats(scriptId) {
            try {
                const script = scripts.find(s => s.id === scriptId);
                if (!script) return;
                
                script.downloads = (script.downloads || 0) + 1;
                totalDownloads++;
                
                await database.ref(`scripts/${scriptId}/downloads`).set(script.downloads);
                await database.ref('totalDownloads').set(totalDownloads);
                
                updateStats();
                
                // Обновляем отображение конкретного скрипта
                const card = document.getElementById(`script-${scriptId}`);
                if (card) {
                    const feature = card.querySelector('.script-features .feature:first-child');
                    if (feature) {
                        feature.querySelector('span').textContent = `Скачиваний: ${script.downloads}`;
                    }
                }
            } catch (error) {
                console.error('Ошибка обновления статистики:', error);
            }
        }
        
        // ================== ОТОБРАЖЕНИЕ ==================
        
        function updateStats() {
            document.getElementById('totalFiles').textContent = scripts.length;
            document.getElementById('totalDownloads').textContent = totalDownloads;
        }
        
        function renderScripts() {
            const containers = {
                'flyscripts': document.getElementById('flyscripts-grid'),
                'scriptich': document.getElementById('scriptich-grid'),
                'other': document.getElementById('other-grid')
            };
            
            // Очищаем все контейнеры
            Object.values(containers).forEach(container => {
                if (container) container.innerHTML = '';
            });
            
            if (scripts.length === 0) {
                showEmptyState();
                return;
            }
            
            // Сортируем скрипты по дате (новые сверху)
            scripts.sort((a, b) => new Date(b.date) - new Date(a.date));
            
            // Рендерим каждый скрипт
            scripts.forEach(script => {
                const scriptCard = createScriptCard(script);
                const container = containers[script.category] || containers['other'];
                
                if (container) {
                    container.appendChild(scriptCard);
                }
            });
        }
        
        function createScriptCard(script) {
            const card = document.createElement('div');
            card.className = 'script-card';
            card.id = `script-${script.id}`;
            
            const icon = script.category === 'flyscripts' ? 'fa-rocket' : 
                        script.category === 'scriptich' ? 'fa-layer-group' : 'fa-star';
            
            card.innerHTML = `
                <div class="script-header">
                    <h3 class="script-title">
                        <i class="fas ${icon}"></i> ${script.name}
                    </h3>
                    <span class="script-badge">script</span>
                </div>
                
                <p class="script-description">
                    ${script.description}
                </p>
                
                <div class="script-features">
                    <div class="feature">
                        <i class="fas fa-download"></i>
                        <span>Скачиваний: ${script.downloads || 0}</span>
                    </div>
                    <div class="feature">
                        <i class="fas fa-calendar"></i>
                        <span>Добавлен: ${script.date}</span>
                    </div>
                </div>
                
                <div class="script-code">
                    ${script.code}
                </div>
                
                <button class="download-btn" onclick="downloadScript('${script.id}')">
                    <i class="fas fa-download"></i> Скачать скрипт
                </button>
                
                ${script.telegramLink ? `
                <a href="${script.telegramLink}" target="_blank" class="telegram-link">
                    <i class="fab fa-telegram"></i> 
                    <span>${script.telegramLink.includes('t.me/Scriptich') ? 'Телеграм: @Scriptich' : 'Telegram'}</span>
                </a>` : ''}
            `;
            
            return card;
        }
        
        function showEmptyState() {
            const containers = {
                'flyscripts': document.getElementById('flyscripts-grid'),
                'scriptich': document.getElementById('scriptich-grid'),
                'other': document.getElementById('other-grid')
            };
            
            const emptyHTML = `
                <div class="script-card" style="text-align: center; padding: 50px;">
                    <div class="empty-icon" style="font-size: 60px; color: #25D366; opacity: 0.5; margin-bottom: 20px;">
                        <i class="fas fa-file-code"></i>
                    </div>
                    <h3 style="color: #DCF8C6; margin-bottom: 15px;">Скриптов пока нет</h3>
                    <p style="color: #90EE90;">
                        Скоро здесь появятся новые скрипты для автоматизации!
                    </p>
                    <div style="margin-top: 30px; color: #6BCF7F; font-size: 12px;">
                        <i class="fas fa-sync-alt fa-spin"></i> Ожидание данных...
                    </div>
                </div>
            `;
            
            Object.values(containers).forEach(container => {
                if (container) container.innerHTML = emptyHTML;
            });
        }
        
        function downloadScript(scriptId) {
            const script = scripts.find(s => s.id === scriptId);
            if (!script) {
                showNotification('❌ Ошибка: скрипт не найден');
                return;
            }
            
            const blob = new Blob([script.code], { 
                type: 'text/plain;charset=utf-8',
                endings: 'native' 
            });
            
            const downloadLink = document.createElement('a');
            downloadLink.href = URL.createObjectURL(blob);
            downloadLink.download = script.filename;
            downloadLink.style.display = 'none';
            
            document.body.appendChild(downloadLink);
            downloadLink.click();
            
            document.body.removeChild(downloadLink);
            
            // Обновляем статистику
            updateDownloadStats(scriptId);
            
            showNotification(`✅ Скрипт "${script.name}" скачан!`);
        }
        
        function showNotification(message) {
            const notification = document.getElementById('notification');
            const text = document.getElementById('notificationText');
            
            text.textContent = message;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 4000);
        }
        
        function showLoading() {
            document.getElementById('loading').classList.add('active');
        }
        
        function hideLoading() {
            document.getElementById('loading').classList.remove('active');
        }
    </script>
</body>
</html>
