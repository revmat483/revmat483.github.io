<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mamas_PUBG_UC_Store</title>
    <style>
        /* Абсолютный минимум. Ничего лишнего. */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            color: #e5e5e5;
        }

        .market {
            max-width: 1200px;
            width: 100%;
            background: #0e0e0e;
            border: 1px solid #1e1e1e;
        }

        /* Хедер с названием магазина */
        .header {
            padding: 40px 32px 16px 32px;
            border-bottom: 1px solid #1a1a1a;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 400;
            letter-spacing: 0.5px;
            color: #ffffff;
            margin-bottom: 6px;
            word-break: break-word;
        }

        .header .description {
            font-size: 13px;
            font-weight: 300;
            color: #666;
            letter-spacing: 0.3px;
        }

        /* Сетка товаров */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1px;
            background: #181818;
            padding: 1px;
        }

        /* Карточка товара */
        .card {
            background: #0e0e0e;
            padding: 32px 24px;
            transition: background 0.15s;
            border: 1px solid transparent;
        }

        .card:hover {
            background: #121212;
            border-color: #2a2a2a;
        }

        .card-category {
            font-size: 11px;
            text-transform: uppercase;
            color: #505050;
            letter-spacing: 1px;
            margin-bottom: 16px;
            font-weight: 400;
        }

        .card-title {
            font-size: 20px;
            font-weight: 500;
            color: #f0f0f0;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .card-desc {
            font-size: 13px;
            color: #707070;
            margin-bottom: 24px;
            font-weight: 300;
            line-height: 1.5;
            border-left: 1px solid #2a2a2a;
            padding-left: 12px;
        }

        .price {
            font-size: 28px;
            font-weight: 300;
            color: #f0f0f0;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        .price small {
            font-size: 14px;
            font-weight: 300;
            color: #555;
            margin-left: 4px;
        }

        .btn {
            width: 100%;
            background: transparent;
            border: 1px solid #2a2a2a;
            color: #ccc;
            padding: 14px 0;
            font-size: 13px;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.15s;
            border-radius: 0;
        }

        .btn:hover {
            background: #1a1a1a;
            border-color: #555;
            color: #fff;
        }

        /* Футер с только Telegram */
        .footer {
            margin-top: 1px;
            background: #0a0a0a;
            padding: 32px;
            border-top: 1px solid #181818;
        }

        .contact-title {
            font-size: 12px;
            text-transform: uppercase;
            color: #606060;
            letter-spacing: 1px;
            margin-bottom: 16px;
            font-weight: 400;
        }

        /* Только Telegram */
        .telegram-link {
            display: inline-flex;
            align-items: center;
            background: transparent;
            border: 1px solid #2a2a2a;
            padding: 12px 32px;
            color: #aaa;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 0.5px;
            transition: 0.15s;
            cursor: pointer;
            text-transform: uppercase;
        }

        .telegram-link:hover {
            border-color: #777;
            color: #fff;
            background: #121212;
        }

        /* Простая строка */
        .notice {
            margin-top: 24px;
            font-size: 11px;
            color: #444;
            border-top: 1px solid #181818;
            padding-top: 16px;
        }

        @media (max-width: 600px) {
            .header, .footer {
                padding-left: 16px;
                padding-right: 16px;
            }
            .card {
                padding: 24px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="market">
        <!-- Хедер с названием магазина и описанием -->
        <div class="header">
            <h1>mamas_PUBG_UC_Store</h1>
            <div class="description">магазин для покупок дешего все</div>
        </div>

        <!-- Товары (3 штуки) -->
        <div class="grid">
            <!-- 60 UC -->
            <div class="card">
                <div class="card-category">UC</div>
                <div class="card-title">60 UC</div>
                <div class="card-desc">Игровая валюта. Моментально.</div>
                <div class="price">83 <small>₽</small></div>
                <button class="btn" onclick="handleOrder('60 UC')">Купить</button>
            </div>

            <!-- Фулл т6 с МК ВК -->
            <div class="card">
                <div class="card-category">СЕТ</div>
                <div class="card-title">Фулл т6 с МК ВК</div>
                <div class="card-desc">Полный комплект, включая M416.</div>
                <div class="price">70 <small>₽</small></div>
                <button class="btn" onclick="handleOrder('Фулл т6 с МК ВК')">Купить</button>
            </div>

            <!-- Любая пушка на выбор -->
            <div class="card">
                <div class="card-category">СКИНЫ</div>
                <div class="card-title">Любая пушка на выбор</div>
                <div class="card-desc">AWM, M24, AKM, M416 и др.</div>
                <div class="price">20 <small>₽</small></div>
                <button class="btn" onclick="handleOrder('Любая пушка')">Купить</button>
            </div>
        </div>

        <!-- Футер с Telegram -->
        <div class="footer">
            <div class="contact-title">СВЯЗЬ</div>
            <!-- ВСТАВЬТЕ СВОЙ TELEGRAM -->
            <a class="telegram-link" onclick="showTelegram()">📱 Telegram</a>
            <div class="notice">
                После нажатия «Купить» напишите в Telegram для оформления.
            </div>
        </div>
    </div>

    <script>
        function handleOrder(item) {
            alert(`Товар: ${item}\nДля покупки напишите в Telegram.`);
        }

        function showTelegram() {
            alert('Telegram: @mamas_PUBG_UC_Store'); // ЗАМЕНИТЕ НА СВОЙ ТЕЛЕГРАМ
        }
    </script>
</body>
</html>
